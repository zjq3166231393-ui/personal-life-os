{# Shared design-system styles. Include in <head> of every page. #}
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1e40af;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --bg: #f5f7fb;
  --text-secondary: #6b7280;
}
body {
  background: var(--bg);
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: .95rem;
  color: #1f2937;
  padding-bottom: 70px;
}
.card {
  border: 0;
  border-radius: 18px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  overflow: hidden;
}
.hero {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  color: #fff;
  border-radius: 22px;
}
.hero-danger {
  background: linear-gradient(135deg, #dc2626, #991b1b);
  color: #fff;
  border-radius: 22px;
}
.form-control, .form-select {
  border-radius: 10px;
}
.form-label {
  font-weight: 500;
  font-size: .875rem;
  margin-bottom: .25rem;
}
.section-title {
  font-size: .8rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.text-success-custom { color: var(--success); }
.text-danger-custom { color: var(--danger); }
/* ── Accessibility ─────────────────────────────────── */
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
.btn:focus-visible, .form-control:focus-visible, .form-select:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ── Mobile optimizations ──────────────────────────── */
@media (max-width: 575px) {
  .container { padding-left: 8px; padding-right: 8px; }
  .hero { padding: 12px 14px !important; border-radius: 16px; }
  .hero .h5 { font-size: 1.05rem; }
  .hero .h4 { font-size: 1.15rem; }
  .card { border-radius: 14px; }
  .card .px-3 { padding-left: 10px !important; padding-right: 10px !important; }
  .btn-sm { padding: 6px 10px; font-size: .8rem; min-height: 36px; }
  .form-control-sm, .form-select-sm { font-size: .875rem; min-height: 36px; }
  table { font-size: .8rem; }
  .d-mobile-none { display: none !important; }
  .text-truncate-mobile { max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
  .actions .btn { padding: 5px 8px; font-size: .75rem; min-width: 32px; }
}
@media (min-width: 576px) {
  .d-mobile-only { display: none !important; }
}
@media (min-width: 768px) {
  body { padding-bottom: 0; }
}
</style>
