{% extends "_base.html" %}
{% block title %}{% if item %}编辑{% else %}新增{% endif %}固定支出 · Personal Life OS{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:560px;">

  <header class="lf-page-header">
    <h1 class="lf-page-header__title">{% if item %}编辑{% else %}新增{% endif %}固定支出</h1>
    <a href="{% url 'recurring_list' %}" class="lf-page-header__back" data-back="history">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </a>
  </header>

  <section class="lf-card lf-card--padded">
    <form method="post">{% csrf_token %}
      <div class="lf-field">
        <label class="lf-label">名称</label>
        <input type="text" name="name" class="lf-input" value="{{ item.name|default:'' }}" maxlength="200" placeholder="如：房租" required>
      </div>
      <div class="lf-row lf-mb-4" style="gap:12px;">
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">金额</label>
          <input type="number" name="amount" class="lf-input lf-num" step="0.01" min="0" value="{{ item.amount|default:'' }}" placeholder="0.00" required>
        </div>
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">分类</label>
          <select name="category" class="lf-select">{% for c in categories %}<option value="{{ c.pk }}" {% if item and item.category_id == c.pk %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>{% endfor %}</select>
        </div>
      </div>
      <div class="lf-row lf-mb-4" style="gap:12px;">
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">频率</label>
          <select name="frequency" class="lf-select">
            <option value="monthly" {% if item.frequency == 'monthly' %}selected{% endif %}>每月</option>
            <option value="weekly" {% if item.frequency == 'weekly' %}selected{% endif %}>每周</option>
            <option value="quarterly" {% if item.frequency == 'quarterly' %}selected{% endif %}>每季度</option>
            <option value="yearly" {% if item.frequency == 'yearly' %}selected{% endif %}>每年</option>
          </select>
        </div>
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">扣款日</label>
          <input type="number" name="due_day" class="lf-input lf-num" min="1" max="31" value="{{ item.due_day|default:'1' }}" required>
        </div>
      </div>
      <div class="lf-row lf-mb-4" style="gap:12px;">
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">开始日期</label>
          <input type="date" name="start_date" class="lf-input" value="{{ item.start_date|date:'Y-m-d'|default:'' }}" required>
        </div>
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">结束日期</label>
          <input type="date" name="end_date" class="lf-input" value="{{ item.end_date|date:'Y-m-d'|default:'' }}" placeholder="留空=无截止">
        </div>
      </div>
      <div class="lf-field">
        <label class="lf-label">提前提醒天数</label>
        <input type="number" name="remind_days_before" class="lf-input lf-num" min="0" max="30" value="{{ item.remind_days_before|default:'3' }}">
        <div class="lf-help">提前几天推送提醒，0 = 不提醒</div>
      </div>
      <div class="lf-row lf-mt-6" style="gap:8px;">
        <button type="submit" class="lf-btn lf-btn--primary">保存</button>
        <a href="{% url 'recurring_list' %}" class="lf-btn lf-btn--ghost">取消</a>
      </div>
    </form>
  </section>

</main>
{% endblock %}
