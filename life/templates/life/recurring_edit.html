<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>{% if item %}编辑{% else %}新增{% endif %}固定支出</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-3 py-md-4" style="max-width:540px">
<section class="hero p-3 p-md-4 shadow-sm mb-3 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">{% if item %}编辑{% else %}新增{% endif %}固定支出</h1><a href="{% url 'recurring_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">名称</label><input type="text" name="name" class="form-control" value="{{ item.name|default:'' }}" maxlength="200" placeholder="如：房租" required></div>
<div class="row mb-3"><div class="col-md-6"><label class="form-label">金额</label><input type="number" name="amount" class="form-control" step="0.01" min="0" value="{{ item.amount|default:'' }}" required></div><div class="col-md-6"><label class="form-label">分类</label><select name="category" class="form-select">{% for c in categories %}<option value="{{ c.pk }}" {% if item and item.category_id == c.pk %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>{% endfor %}</select></div></div>
<div class="row mb-3"><div class="col-md-6"><label class="form-label">频率</label><select name="frequency" class="form-select"><option value="monthly" {% if item.frequency == 'monthly' %}selected{% endif %}>每月</option><option value="weekly" {% if item.frequency == 'weekly' %}selected{% endif %}>每周</option><option value="quarterly" {% if item.frequency == 'quarterly' %}selected{% endif %}>每季度</option><option value="yearly" {% if item.frequency == 'yearly' %}selected{% endif %}>每年</option></select></div><div class="col-md-6"><label class="form-label">扣款日</label><input type="number" name="due_day" class="form-control" min="1" max="31" value="{{ item.due_day|default:'1' }}" required></div></div>
<div class="row mb-3"><div class="col-md-6"><label class="form-label">开始日期</label><input type="date" name="start_date" class="form-control" value="{{ item.start_date|date:'Y-m-d'|default:'' }}" required></div><div class="col-md-6"><label class="form-label">结束日期</label><input type="date" name="end_date" class="form-control" value="{{ item.end_date|date:'Y-m-d'|default:'' }}" placeholder="留空=无截止"></div></div>
<div class="mb-3"><label class="form-label">提前提醒天数</label><input type="number" name="remind_days_before" class="form-control" min="0" max="30" value="{{ item.remind_days_before|default:'3' }}"></div>
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
