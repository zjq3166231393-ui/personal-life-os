<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>{{ expense.title }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:540px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">{{ expense.title }}</h1><p class="mb-0 opacity-75 small">{{ expense.occurred_on }}</p></div><a href="{% url 'expense_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><p><strong>金额：</strong>¥{{ expense.amount }}</p><p><strong>分类：</strong>{{ expense.category.name|default:'未分类' }}</p><p><strong>备注：</strong>{{ expense.raw_text|default:'无' }}</p><p class="text-secondary small">创建于 {{ expense.created_at|date:'Y-m-d H:i' }}</p>
<div class="mt-3"><a href="{% url 'expense_edit' expense.pk %}" class="btn btn-primary btn-sm">编辑</a><a href="{% url 'expense_delete' expense.pk %}" class="btn btn-outline-danger btn-sm ms-2">删除</a></div></section>
</main></body></html>
