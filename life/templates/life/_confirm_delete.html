{% extends "_base.html" %}
{% block title %}确认删除 · Personal Life OS{% endblock %}
{% block body_class %}lf-has-bottom-nav{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:480px;">
  <header class="lf-page-header">
    <h1 class="lf-page-header__title">确认删除</h1>
  </header>
  <form method="post" class="lf-card">
    {% csrf_token %}
    <p class="lf-text-md lf-mb-4">确定要删除「{{ item.title }}」吗？此操作不可撤销。</p>
    <div class="lf-row" style="gap:10px;">
      <button type="submit" class="lf-btn lf-btn--primary" style="background:var(--danger);border-color:var(--danger);">确认删除</button>
      <a href="{% url 'daily_list' %}" class="lf-btn lf-btn--ghost">取消</a>
    </div>
  </form>
</main>
{% endblock %}
