<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>{% if category %}编辑{% else %}新增{% endif %}分类</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:540px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">{% if category %}编辑{% else %}新增{% endif %}分类</h1><a href="{% url 'category_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">名称</label><input type="text" name="name" class="form-control" value="{{ category.name|default:'' }}" maxlength="50" required></div>
<div class="row mb-3"><div class="col-md-6"><label class="form-label">类型</label><select name="type" class="form-select">{% if not category %}<option value="expense">支出</option><option value="income">收入</option>{% else %}<option value="{{ category.type }}" selected>{% if category.type == 'expense' %}支出{% else %}收入{% endif %}</option>{% endif %}</select></div><div class="col-md-6"><label class="form-label">图标 emoji</label><input type="text" name="icon" class="form-control" value="{{ category.icon|default:'' }}" placeholder="如 🐱"></div></div>
<div class="mb-4"><label class="form-label">颜色</label><input type="color" name="color" class="form-control form-control-color" value="{{ category.color|default:'#6b7280' }}" style="width:60px;height:38px"></div>
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
