<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>停用分类</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:480px">
<section class="hero p-4 shadow-sm mb-4"><h1 class="h5 fw-bold mb-0">{% if blocked %}无法停用{% else %}确认停用{% endif %}</h1></section>
<section class="card shadow-sm p-4">
{% if blocked %}<div class="alert alert-warning">「<strong>{{ category.name }}</strong>」仍有 <strong>{{ refs }}</strong> 条支出记录引用，无法停用。请先将这些记录改为其他分类。</div>
{% else %}<p>确定要停用「<strong>{{ category.name }}</strong>」吗？停用后不再出现在分类列表中，已有记录不受影响。</p>
<form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">确认停用</button>{% endif %}
<a href="{% url 'category_list' %}" class="btn btn-outline-secondary ms-2">{% if blocked %}返回{% else %}取消{% endif %}</a></form></section>
</main></body></html>
