<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>复盘</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:22px}pre{white-space:pre-wrap;font-family:inherit;font-size:.95rem}</style></head>
<body><main class="container py-3 py-md-4" style="max-width:700px">
<section class="hero p-3 p-md-4 shadow-sm mb-3 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">{{ start }} ~ {{ end }}</h1><span class="opacity-75 small">{% if period == 'weekly' %}每周{% else %}每月{% endif %}复盘</span></div><div><a href="?period={% if period == 'weekly' %}monthly{% else %}weekly{% endif %}" class="btn btn-sm btn-light">切换</a><a href="{% url 'home' %}" class="text-white text-decoration-none small ms-2">← 首页</a></div></section>

{% if is_confirmed %}
<div class="alert alert-success small">已确认的复盘</div>
{% endif %}

<section class="card shadow-sm p-3 p-md-4 mb-3">
<pre>{{ draft }}</pre>
{% if not is_confirmed %}
<form method="post" class="mt-3">{% csrf_token %}<textarea name="content" class="form-control mb-2" rows="12" style="font-family:inherit">{{ draft }}</textarea><button type="submit" class="btn btn-dark">确认保存</button></form>
{% endif %}
</section>
</main></body></html>
