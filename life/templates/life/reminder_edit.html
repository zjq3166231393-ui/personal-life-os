<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>{% if reminder %}编辑{% else %}新增{% endif %}提醒</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-3 py-md-4" style="max-width:540px">
<section class="hero p-3 p-md-4 shadow-sm mb-3 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">{% if reminder %}编辑{% else %}新增{% endif %}提醒</h1><a href="{% url 'reminder_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">标题</label><input type="text" name="title" class="form-control" value="{{ reminder.title|default:'' }}" maxlength="200" placeholder="如：姐姐生日" required></div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">类型</label><select name="reminder_type" class="form-select"><option value="birthday" {% if reminder.reminder_type == 'birthday' %}selected{% endif %}>🎂 生日</option><option value="bill" {% if reminder.reminder_type == 'bill' %}selected{% endif %}>💳 账单</option><option value="custom" {% if reminder.reminder_type == 'custom' %}selected{% endif %}>📌 自定义</option><option value="task" {% if reminder.reminder_type == 'task' %}selected{% endif %}>✅ 任务</option></select></div>
  <div class="col-md-6"><label class="form-label">重复</label><select name="recurrence_rule" class="form-select"><option value="none" {% if reminder.recurrence_rule == 'none' %}selected{% endif %}>不重复</option><option value="monthly" {% if reminder.recurrence_rule == 'monthly' %}selected{% endif %}>每月</option><option value="yearly" {% if reminder.recurrence_rule == 'yearly' %}selected{% endif %}>每年</option></select></div>
</div>
<div class="mb-3"><label class="form-label">事件日期</label><input type="datetime-local" name="event_at" class="form-control" value="{% if reminder %}{{ reminder.event_at|date:'Y-m-d\TH:i' }}{% endif %}" required></div>
<div class="mb-3"><label class="form-label">提前提醒（天）</label><input type="text" name="remind_days_before" class="form-control" value="{{ reminder.remind_days_before|default:'1' }}" placeholder="如：1,7,15"></div>
{% if reminder %}<div class="mb-3 form-check"><input type="checkbox" name="is_enabled" id="id_is_enabled" class="form-check-input" {% if reminder.is_enabled %}checked{% endif %}><label class="form-check-label" for="id_is_enabled">启用</label></div>{% endif %}
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
