{% extends "_base.html" %}
{% block title %}编辑任务 · Personal Life OS{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:560px;">

  <header class="lf-page-header">
    <h1 class="lf-page-header__title">编辑任务</h1>
    <a href="{% url 'task_list' %}" class="lf-page-header__back" data-back="history">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </a>
  </header>

  <section class="lf-card lf-card--padded">
    <form method="post">{% csrf_token %}
      <div class="lf-field">
        <label class="lf-label">标题</label>
        <input type="text" name="title" class="lf-input" value="{{ task.title }}" maxlength="200" required>
      </div>
      <div class="lf-row" style="gap:12px;">
        <div class="lf-field" style="flex:1;margin-bottom:16px;">
          <label class="lf-label">状态</label>
          <select name="status" class="lf-select">{% for val, label in task.Status.choices %}<option value="{{ val }}" {% if task.status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
        </div>
        <div class="lf-field" style="flex:1;margin-bottom:16px;">
          <label class="lf-label">优先级</label>
          <select name="priority" class="lf-select">
            <option value="1" {% if task.priority == 1 %}selected{% endif %}>高</option>
            <option value="2" {% if task.priority == 2 %}selected{% endif %}>中</option>
            <option value="3" {% if task.priority == 3 %}selected{% endif %}>低</option>
          </select>
        </div>
      </div>
      <div class="lf-field">
        <label class="lf-label">描述</label>
        <textarea name="description" class="lf-textarea" rows="3" maxlength="5000" placeholder="补充背景、链接、要点...">{{ task.description|default:'' }}</textarea>
      </div>
      <div class="lf-row" style="gap:12px;">
        <div class="lf-field" style="flex:1;margin-bottom:16px;">
          <label class="lf-label">截止时间</label>
          <input type="datetime-local" name="due_at" class="lf-input" value="{% if task.due_at %}{{ task.due_at|date:'Y-m-d\TH:i' }}{% endif %}">
        </div>
        <div class="lf-field" style="flex:1;margin-bottom:16px;">
          <label class="lf-label">来源</label>
          <select name="source" class="lf-select">{% for val, label in task.Source.choices %}<option value="{{ val }}" {% if task.source == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
        </div>
      </div>
      <h3 class="lf-section-title lf-mt-4">重复</h3>
      <div class="lf-row" style="gap:12px;">
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">频率</label>
          <select name="recurrence_rule" class="lf-select">
            <option value="none" {% if task.recurrence_rule == 'none' %}selected{% endif %}>不重复</option>
            <option value="daily" {% if task.recurrence_rule == 'daily' %}selected{% endif %}>每天</option>
            <option value="weekly" {% if task.recurrence_rule == 'weekly' %}selected{% endif %}>每周</option>
            <option value="monthly" {% if task.recurrence_rule == 'monthly' %}selected{% endif %}>每月</option>
            <option value="yearly" {% if task.recurrence_rule == 'yearly' %}selected{% endif %}>每年</option>
          </select>
        </div>
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">每月几号</label>
          <input type="number" name="recurrence_day" class="lf-input lf-num" min="1" max="31" value="{{ task.recurrence_day|default:'' }}" placeholder="留空=当天">
        </div>
        <div class="lf-field" style="flex:1;margin-bottom:0;">
          <label class="lf-label">提前提醒</label>
          <input type="number" name="recurrence_days_before" class="lf-input lf-num" min="0" value="{{ task.recurrence_days_before|default:'0' }}">
        </div>
      </div>
      <div class="lf-row lf-mt-6" style="gap:8px;">
        <button type="submit" class="lf-btn lf-btn--primary">保存</button>
        <a href="{% url 'task_list' %}" class="lf-btn lf-btn--ghost">取消</a>
      </div>
    </form>
  </section>

</main>
{% block bottom_nav %}{% include "life/_bottom_nav.html" %}{% endblock %}
{% endblock %}
