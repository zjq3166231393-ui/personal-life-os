<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>编辑待办</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:540px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">编辑待办</h1><a href="{% url 'task_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">标题</label><input type="text" name="title" class="form-control" value="{{ task.title }}" required></div>
<div class="mb-3"><label class="form-label">优先级</label><select name="priority" class="form-select"><option value="1" {% if task.priority == 1 %}selected{% endif %}>高</option><option value="2" {% if task.priority == 2 %}selected{% endif %}>中</option><option value="3" {% if task.priority == 3 %}selected{% endif %}>低</option></select></div>
<div class="mb-3"><label class="form-label">截止时间</label><input type="datetime-local" name="due_at" class="form-control" value="{{ task.due_at|date:'Y-m-d\TH:i' }}"></div>
<div class="mb-3 form-check"><input type="checkbox" name="completed" id="id_completed" class="form-check-input" {% if task.completed %}checked{% endif %}><label class="form-check-label" for="id_completed">已完成</label></div>
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
