<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>编辑任务</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-3 py-md-4" style="max-width:540px">
<section class="hero p-3 p-md-4 shadow-sm mb-3 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">编辑任务</h1><a href="{% url 'task_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">标题</label><input type="text" name="title" class="form-control" value="{{ task.title }}" maxlength="200" required></div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">状态</label><select name="status" class="form-select">{% for val, label in task.Status.choices %}<option value="{{ val }}" {% if task.status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label">优先级</label><select name="priority" class="form-select"><option value="1" {% if task.priority == 1 %}selected{% endif %}>🔴 高</option><option value="2" {% if task.priority == 2 %}selected{% endif %}>🟡 中</option><option value="3" {% if task.priority == 3 %}selected{% endif %}>🟢 低</option></select></div>
</div>
<div class="mb-3"><label class="form-label">描述</label><textarea name="description" class="form-control" rows="3" maxlength="5000">{{ task.description|default:'' }}</textarea></div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">截止时间</label><input type="datetime-local" name="due_at" class="form-control" value="{% if task.due_at %}{{ task.due_at|date:'Y-m-d\TH:i' }}{% endif %}"></div>
  <div class="col-md-6"><label class="form-label">来源</label><select name="source" class="form-select">{% for val, label in task.Source.choices %}<option value="{{ val }}" {% if task.source == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
</div>
<div class="row mb-3">
  <div class="col-md-4"><label class="form-label">重复</label><select name="recurrence_rule" class="form-select"><option value="none" {% if task.recurrence_rule == 'none' %}selected{% endif %}>不重复</option><option value="daily" {% if task.recurrence_rule == 'daily' %}selected{% endif %}>每天</option><option value="weekly" {% if task.recurrence_rule == 'weekly' %}selected{% endif %}>每周</option><option value="monthly" {% if task.recurrence_rule == 'monthly' %}selected{% endif %}>每月</option><option value="yearly" {% if task.recurrence_rule == 'yearly' %}selected{% endif %}>每年</option></select></div>
  <div class="col-md-4"><label class="form-label">每月几号</label><input type="number" name="recurrence_day" class="form-control" min="1" max="31" value="{{ task.recurrence_day|default:'' }}" placeholder="留空=当天"></div>
  <div class="col-md-4"><label class="form-label">提前提醒(天)</label><input type="number" name="recurrence_days_before" class="form-control" min="0" value="{{ task.recurrence_days_before|default:'0' }}"></div>
</div>
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
