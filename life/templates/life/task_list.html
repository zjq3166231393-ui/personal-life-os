<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务列表</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}.status-todo{border-left:3px solid #3b82f6}.status-in_progress{border-left:3px solid #f59e0b}.status-completed{opacity:.5}.status-cancelled{opacity:.4;text-decoration:line-through}</style></head>
<body><main class="container py-3 py-md-4" style="max-width:780px">
<section class="hero p-3 p-md-4 shadow-sm mb-3 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">任务列表</h1></div><a href="{% url 'home' %}" class="text-white text-decoration-none small">← 首页</a></section>

<section class="card shadow-sm p-0">
{% for t in tasks %}
<div class="px-3 py-2 border-bottom status-{{ t.status }}">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <span class="badge {% if t.status == 'todo' %}text-bg-primary{% elif t.status == 'in_progress' %}text-bg-warning{% elif t.status == 'completed' %}text-bg-success{% elif t.status == 'cancelled' %}text-bg-secondary{% else %}text-bg-light{% endif %} me-1">{{ t.get_status_display }}</span>
      {% if t.priority == 1 %}<span class="badge text-bg-danger me-1">高</span>{% endif %}
      <a href="{% url 'task_detail' t.pk %}" class="text-decoration-none {% if t.status == 'completed' or t.status == 'cancelled' %}text-muted{% endif %}">{{ t.title }}</a>
      {% if t.due_at %}<span class="text-secondary small ms-1">{{ t.due_at|date:'m/d H:i' }}</span>{% endif %}
    </div>
    <div><a href="{% url 'task_edit' t.pk %}" class="btn btn-sm btn-outline-secondary">编辑</a></div>
  </div>
</div>
{% empty %}<div class="px-3 py-4 text-center text-secondary">还没有任务。</div>{% endfor %}
</section>
</main></body></html>
