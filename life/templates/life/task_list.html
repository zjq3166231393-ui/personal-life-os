<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>待办列表</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}.done{opacity:.5;text-decoration:line-through}</style></head>
<body><main class="container py-4" style="max-width:720px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">待办列表</h1></div><a href="{% url 'home' %}" class="text-white text-decoration-none small">← 首页</a></section>
<section class="card shadow-sm p-4">{% for t in tasks %}<div class="d-flex justify-content-between border-bottom py-2"><div class="{% if t.completed %}done{% endif %}"><span class="badge {% if t.priority == 1 %}text-bg-danger{% else %}text-bg-primary{% endif %} me-2">{% if t.priority == 1 %}高{% else %}待办{% endif %}</span><a href="{% url 'task_detail' t.pk %}" class="text-decoration-none">{{ t.title }}</a>{% if t.due_at %}<span class="text-secondary small ms-2">{{ t.due_at|date:'m月d日 H:i' }}</span>{% endif %}</div><div><a href="{% url 'task_edit' t.pk %}" class="btn btn-sm btn-outline-secondary">编辑</a></div></div>{% empty %}<p class="text-secondary mb-0">还没有待办事项。</p>{% endfor %}</section>
</main></body></html>
