<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>删除账目</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:480px">
<section class="hero p-4 shadow-sm mb-4"><h1 class="h5 fw-bold mb-0">确认删除</h1></section>
<section class="card shadow-sm p-4"><p>确定要删除「<strong>{{ expense.note|default:expense.merchant|default:'未命名' }}</strong>」（¥{{ expense.amount }}）吗？</p><p class="text-secondary small">数据会保留在数据库中，可追溯。</p>
<form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">确认删除</button><a href="{% url 'expense_list' %}" class="btn btn-outline-secondary ms-2">取消</a></form></section>
</main></body></html>
