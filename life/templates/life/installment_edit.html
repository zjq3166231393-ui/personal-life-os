<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>{% if plan %}编辑{% else %}新增{% endif %}分期 - Personal Life OS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-3 py-md-4" style="max-width:540px">
<section class="hero p-3 p-md-4 shadow-sm mb-3 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">{% if plan %}编辑{% else %}新增{% endif %}分期</h1><a href="{% url 'installment_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">名称</label><input type="text" name="name" class="form-control" value="{{ plan.name|default:'' }}" maxlength="200" placeholder="如：iPhone 分期" required></div>
<div class="mb-3"><label class="form-label">分类</label><select name="category" class="form-select">{% for c in categories %}<option value="{{ c.pk }}" {% if plan and plan.category_id == c.pk %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>{% endfor %}</select></div>
<div class="row mb-3"><div class="col-md-6"><label class="form-label">总金额</label><input type="number" name="total_amount" class="form-control" step="0.01" min="0" value="{{ plan.total_amount|default:'' }}" required></div><div class="col-md-6"><label class="form-label">每期金额</label><input type="number" name="installment_amount" class="form-control" step="0.01" min="0" value="{{ plan.installment_amount|default:'' }}" required></div></div>
<div class="row mb-3"><div class="col-md-6"><label class="form-label">总期数</label><input type="number" name="total_periods" class="form-control" min="1" value="{{ plan.total_periods|default:'12' }}" required></div><div class="col-md-6"><label class="form-label">下期还款日</label><input type="date" name="next_due_date" class="form-control" value="{{ plan.next_due_date|date:'Y-m-d'|default:'' }}" required></div></div>
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
