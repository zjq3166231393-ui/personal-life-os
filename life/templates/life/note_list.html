<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>随心记</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:720px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">随心记</h1></div><a href="{% url 'home' %}" class="text-white text-decoration-none small">← 首页</a></section>
<section class="card shadow-sm p-4">{% for n in notes %}<div class="d-flex justify-content-between border-bottom py-2"><div><span class="badge text-bg-light me-2">📝</span><a href="{% url 'note_detail' n.pk %}" class="text-decoration-none">{{ n.title }}</a>{% if n.occurred_on %}<span class="text-secondary small ms-2">{{ n.occurred_on|date:'m月d日' }}</span>{% endif %}</div><div><a href="{% url 'note_edit' n.pk %}" class="btn btn-sm btn-outline-secondary">编辑</a></div></div>{% empty %}<p class="text-secondary mb-0">还没有笔记。用首页输入框记录想法。。</p>{% endfor %}</section>
</main></body></html>
