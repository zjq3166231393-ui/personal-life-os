<!-- Fixed bottom navigation — mobile-first, touch-friendly -->
{% url 'home' as home_url %}
{% url 'expense_list' as exp_url %}
{% url 'task_list' as task_url %}
{% url 'dashboard' as dash_url %}
{% url 'budget' as bud_url %}

<nav class="bottom-nav d-md-none">
  <a href="{{ home_url }}" class="nav-item {% if request.path == home_url %}active{% endif %}">🏠<span>今日</span></a>
  <a href="{{ exp_url }}" class="nav-item {% if exp_url in request.path %}active{% endif %}">💰<span>账目</span></a>
  <a href="{{ task_url }}" class="nav-item {% if task_url in request.path %}active{% endif %}">✅<span>任务</span></a>
  <a href="{{ dash_url }}" class="nav-item {% if dash_url in request.path %}active{% endif %}">📊<span>看板</span></a>
  <a href="{{ bud_url }}" class="nav-item {% if bud_url in request.path %}active{% endif %}">💵<span>预算</span></a>
</nav>

<style>
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e5e7eb;padding:6px 0 env(safe-area-inset-bottom,8px) 0}
.bottom-nav .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#6b7280;font-size:.7rem;min-width:56px;min-height:48px;justify-content:center;border-radius:12px;transition:all .15s}
.bottom-nav .nav-item span{font-size:.65rem;margin-top:1px}
.bottom-nav .nav-item.active{color:#2563eb;font-weight:600}
.bottom-nav .nav-item:active{background:#f3f4f6}
body{padding-bottom:70px}
@media(min-width:768px){body{padding-bottom:0}}
</style>
