{% load static %}
{% comment %}
Life OS — 5-tab bottom navigation.
Active state computed from request.resolver_match.url_name.
{% endcomment %}
{% with url_name=request.resolver_match.url_name|default:'' %}
<nav class="lf-bottom-nav" role="navigation" aria-label="主导航">
  <a href="{% url 'home' %}" class="lf-bottom-nav__item {% if url_name == 'home' or url_name == '' %}is-active{% endif %}">
    <span class="lf-bottom-nav__icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 4l9 5.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
    </span>
    <span>首页</span>
  </a>
  <a href="{% url 'expense_list' %}" class="lf-bottom-nav__item {% if url_name == 'expense_list' or url_name == 'expense_detail' or url_name == 'expense_edit' %}is-active{% endif %}">
    <span class="lf-bottom-nav__icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    </span>
    <span>账目</span>
  </a>
  <a href="{% url 'daily_list' %}" class="lf-bottom-nav__item {% if url_name == 'daily_list' or url_name == 'daily_create' or url_name == 'daily_edit' %}is-active{% endif %}">
    <span class="lf-bottom-nav__icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </span>
    <span>打卡</span>
  </a>
  <a href="{% url 'dashboard' %}" class="lf-bottom-nav__item {% if url_name == 'dashboard' %}is-active{% endif %}">
    <span class="lf-bottom-nav__icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    </span>
    <span>看板</span>
  </a>
  <a href="{% url 'note_list' %}" class="lf-bottom-nav__item {% if url_name == 'note_list' or url_name == 'note_detail' or url_name == 'note_edit' or url_name == 'note_create' %}is-active{% endif %}">
    <span class="lf-bottom-nav__icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </span>
    <span>随心记</span>
  </a>
  <a href="{% url 'profile' %}" class="lf-bottom-nav__item {% if url_name == 'profile' or url_name == 'appearance' or url_name == 'delete_account' %}is-active{% endif %}">
    <span class="lf-bottom-nav__icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18a6 6 0 0 1 11 0"/></svg>
    </span>
    <span>我的</span>
  </a>
</nav>
<div aria-hidden="true" style="height:calc(64px + env(safe-area-inset-bottom, 0px));"></div>
{% endwith %}
