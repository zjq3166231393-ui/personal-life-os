<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{border:0;border-radius:18px;text-align:center}</style></head>
<body><div class="card shadow-sm p-5" style="max-width:420px">
  <div style="font-size:3rem;margin-bottom:.5rem">{{ icon }}</div>
  <h1 class="h4 fw-bold mb-2">{{ title }}</h1>
  <p class="text-secondary mb-3">{{ message }}</p>
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-dark">{{ action_label }}</a>{% endif %}
</div></body></html>
