<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>编辑支出</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:540px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">编辑支出</h1><a href="{% url 'expense_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">标题</label><input type="text" name="title" class="form-control" value="{{ expense.title }}" required></div>
<div class="mb-3"><label class="form-label">金额</label><input type="number" name="amount" class="form-control" step="0.01" value="{{ expense.amount }}" required></div>
<div class="mb-3"><label class="form-label">日期</label><input type="date" name="occurred_on" class="form-control" value="{{ expense.occurred_on|date:'Y-m-d' }}" required></div>
<div class="mb-3"><label class="form-label">分类</label><select name="category" class="form-select">{% for c in categories %}<option value="{{ c.pk }}" {% if c.pk == expense.category_id %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>{% endfor %}</select></div>
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
