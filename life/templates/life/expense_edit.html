<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>编辑账目</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:540px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><h1 class="h5 fw-bold mb-0">编辑账目</h1><a href="{% url 'expense_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">类型</label><select name="type" class="form-select"><option value="expense" {% if expense.type == 'expense' %}selected{% endif %}>支出</option><option value="income" {% if expense.type == 'income' %}selected{% endif %}>收入</option><option value="transfer" {% if expense.type == 'transfer' %}selected{% endif %}>转账</option></select></div>
  <div class="col-md-6"><label class="form-label">金额</label><input type="number" name="amount" class="form-control" step="0.01" min="0.01" value="{{ expense.amount }}" required></div>
</div>
<div class="mb-3"><label class="form-label">备注</label><input type="text" name="note" class="form-control" value="{{ expense.note|default:'' }}" maxlength="500" placeholder="如：午餐"></div>
<div class="mb-3"><label class="form-label">商户</label><input type="text" name="merchant" class="form-control" value="{{ expense.merchant|default:'' }}" maxlength="200" placeholder="如：美团外卖"></div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">时间</label><input type="datetime-local" name="occurred_at" class="form-control" value="{{ expense.occurred_at|date:'Y-m-d\TH:i' }}" required></div>
  <div class="col-md-6"><label class="form-label">分类</label><select name="category" class="form-select">{% for c in categories %}<option value="{{ c.pk }}" {% if c.pk == expense.category_id %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>{% endfor %}</select></div>
</div>
<div class="row mb-3">
  <div class="col-md-6"><label class="form-label">来源</label><select name="source" class="form-select">{% for val, label in expense.Source.choices %}<option value="{{ val }}" {% if expense.source == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div class="col-md-6"><label class="form-label">状态</label><select name="status" class="form-select">{% for val, label in expense.Status.choices %}<option value="{{ val }}" {% if expense.status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
</div>
<button type="submit" class="btn btn-dark">保存</button></form></section>
</main></body></html>
