<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><title>{{ note.title }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:540px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">{{ note.title }}</h1></div><a href="{% url 'note_list' %}" class="text-white text-decoration-none small">← 返回</a></section>
<section class="card shadow-sm p-4">{% if note.occurred_on %}<p><strong>日期：</strong>{{ note.occurred_on }}</p>{% endif %}<p><strong>备注：</strong>{{ note.raw_text|default:'无' }}</p><p class="text-secondary small">创建于 {{ note.created_at|date:'Y-m-d H:i' }}</p>
<div class="mt-3"><a href="{% url 'note_edit' note.pk %}" class="btn btn-primary btn-sm">编辑</a><a href="{% url 'note_delete' note.pk %}" class="btn btn-outline-danger btn-sm ms-2">删除</a></div></section>
</main></body></html>
