<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>提醒</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:22px}.disabled{opacity:.4}</style></head>
<body><main class="container py-3 py-md-4" style="max-width:720px">
<section class="hero p-3 p-md-4 shadow-sm mb-3 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">提醒</h1></div><div><a href="{% url 'reminder_create' %}" class="btn btn-sm btn-light">+ 新增</a><a href="{% url 'home' %}" class="text-white text-decoration-none small ms-2">← 首页</a></div></section>

<section class="card shadow-sm p-0">
{% for r in reminders %}
<div class="px-3 py-2 border-bottom {% if not r.is_enabled %}disabled{% endif %}">
  <div class="d-flex flex-wrap justify-content-between align-items-center">
    <div>
      <span class="badge text-bg-light me-1">{{ r.get_reminder_type_display }}</span>
      <strong>{{ r.title }}</strong>
      <span class="text-secondary small ms-1">{{ r.event_at|date:'Y-m-d' }}</span>
      {% if r.recurrence_rule != 'none' %}<span class="badge text-bg-info small ms-1">{{ r.get_recurrence_rule_display }}</span>{% endif %}
    </div>
    <div>
      <a href="{% url 'reminder_toggle' r.pk %}" class="btn btn-sm {% if r.is_enabled %}btn-outline-warning{% else %}btn-outline-success{% endif %}">{% if r.is_enabled %}停用{% else %}启用{% endif %}</a>
      <a href="{% url 'reminder_edit' r.pk %}" class="btn btn-sm btn-outline-secondary ms-1">编辑</a>
    </div>
  </div>
</div>
{% empty %}<div class="px-3 py-4 text-center text-secondary">还没有提醒。添加生日、缴费、纪念日等。</div>{% endfor %}
</section>
</main></body></html>
