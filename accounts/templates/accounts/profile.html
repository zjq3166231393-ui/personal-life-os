<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人设置 - Personal Life OS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style>
</head>
<body>
<main class="container py-4 py-md-5" style="max-width:540px">
  <section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between align-items-center">
    <div><h1 class="h5 fw-bold mb-0">个人设置</h1><p class="mb-0 opacity-75 small mt-1">{{ user.username }}</p></div>
    <a href="{% url 'home' %}" class="text-white text-decoration-none small">← 返回首页</a>
  </section>
  <section class="card shadow-sm p-4">
    <form method="post" novalidate>{% csrf_token %}
      <div class="mb-3"><label for="id_display_name" class="form-label">显示名称</label><input type="text" name="display_name" id="id_display_name" class="form-control" value="{{ form.display_name.value|default:'' }}" placeholder="留空则使用用户名"></div>
      <div class="row mb-3">
        <div class="col-md-6"><label for="id_timezone" class="form-label">时区</label><select name="timezone" id="id_timezone" class="form-select"><option value="Asia/Shanghai" {% if form.timezone.value == "Asia/Shanghai" %}selected{% endif %}>北京时间</option><option value="Asia/Tokyo" {% if form.timezone.value == "Asia/Tokyo" %}selected{% endif %}>东京</option><option value="America/New_York" {% if form.timezone.value == "America/New_York" %}selected{% endif %}>纽约</option><option value="Europe/London" {% if form.timezone.value == "Europe/London" %}selected{% endif %}>伦敦</option></select></div>
        <div class="col-md-6"><label for="id_currency" class="form-label">货币</label><select name="currency" id="id_currency" class="form-select"><option value="CNY" {% if form.currency.value == "CNY" %}selected{% endif %}>人民币 ¥</option><option value="USD" {% if form.currency.value == "USD" %}selected{% endif %}>美元 $</option><option value="JPY" {% if form.currency.value == "JPY" %}selected{% endif %}>日元 ¥</option></select></div>
      </div>
      <div class="mb-3"><label for="id_monthly_budget" class="form-label">月度预算</label><input type="number" name="monthly_budget" id="id_monthly_budget" class="form-control" step="0.01" min="0" value="{{ form.monthly_budget.value|default:'' }}" placeholder="留空表示不设置预算"></div>
      <div class="mb-3"><label for="id_daily_ai_limit" class="form-label">单日 AI 调用上限</label><input type="number" name="daily_ai_limit" id="id_daily_ai_limit" class="form-control" min="0" value="{{ form.daily_ai_limit.value|default:'20' }}" placeholder="0=不限制"></div><div class="mb-4 form-check form-switch"><input type="checkbox" name="ai_parsing_enabled" id="id_ai_parsing_enabled" class="form-check-input" {% if form.ai_parsing_enabled.value %}checked{% endif %}><label for="id_ai_parsing_enabled" class="form-check-label">启用 AI 解析</label></div>
      <button type="submit" class="btn btn-dark">保存设置</button>
    </form>
  </section>
</main>
</body>
</html>
