{% extends "_base.html" %}
{% block title %}邮件已发送 · Personal Life OS{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:480px;padding-top:48px;">
  <section class="lf-card lf-card--padded lf-text-center">
    <div style="width:56px;height:56px;margin:0 auto 16px;background:var(--info-soft);border-radius:16px;display:flex;align-items:center;justify-content:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--info)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6 12 13 2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
    </div>
    <h1 class="lf-page-header__title lf-mb-2">邮件已发送</h1>
    <p class="lf-text-sm lf-text-faint lf-mb-4">如果该邮箱已注册，重置链接已发送。</p>
    <a href="{% url 'login' %}" class="lf-btn lf-btn--secondary lf-btn--block">返回登录</a>
  </section>
</main>
{% endblock %}
