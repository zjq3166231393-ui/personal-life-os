<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>设置新密码</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:480px"><section class="hero p-4 shadow-sm mb-4"><h1 class="h5 fw-bold">设置新密码</h1></section><section class="card shadow-sm p-4">{% if validlink %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">新密码</label><input type="password" name="new_password1" class="form-control" required></div><div class="mb-3"><label class="form-label">确认密码</label><input type="password" name="new_password2" class="form-control" required></div><button type="submit" class="btn btn-dark w-100">重置</button></form>{% else %}<p>链接无效或已过期。</p>{% endif %}</section></main></body></html>
