{% extends "_base.html" %}
{% block title %}设置新密码 · Personal Life OS{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:440px;padding-top:48px;">
  <section class="lf-hero lf-text-center lf-mb-6" style="padding:32px 24px;">
    <h1 style="font-size:22px;font-weight:700;color:#fff;margin:0;">设置新密码</h1>
    <p style="margin:6px 0 0;color:rgba(255,255,255,.8);font-size:13px;">请输入你的新密码</p>
  </section>
  <section class="lf-card lf-card--padded">
    {% if validlink %}
    <form method="post">{% csrf_token %}
      <div class="lf-field">
        <label for="id_new_password1" class="lf-label">新密码</label>
        <input type="password" name="new_password1" id="id_new_password1" class="lf-input" required>
      </div>
      <div class="lf-field">
        <label for="id_new_password2" class="lf-label">确认密码</label>
        <input type="password" name="new_password2" id="id_new_password2" class="lf-input" required>
      </div>
      <button type="submit" class="lf-btn lf-btn--primary lf-btn--lg lf-btn--block">重置密码</button>
    </form>
    {% else %}
    <div class="lf-alert lf-alert--warning">链接无效或已过期，请重新申请重置。</div>
    <a href="{% url 'password_reset' %}" class="lf-btn lf-btn--secondary lf-btn--block">重新申请</a>
    {% endif %}
  </section>
</main>
{% endblock %}
