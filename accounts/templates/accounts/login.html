<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - Personal Life OS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style>
</head>
<body>
<main class="container py-4 py-md-5" style="max-width:480px">
  <section class="hero p-4 shadow-sm mb-4 text-center">
    <h1 class="h4 fw-bold mb-1">Personal Life OS</h1>
    <p class="mb-0 opacity-75 small">登录以查看您的今日看板</p>
  </section>
  <section class="card shadow-sm p-4">
    {% if form.errors %}
    <div class="alert alert-danger">用户名或密码不正确，请重试。</div>
    {% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">用户名</label>
        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">密码</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-dark w-100">登录</button>
    </form>
    <p class="text-center text-secondary mt-3 mb-0 small">还没有账号？<a href="{% url 'register' %}">立即注册</a></p>
  </section>
</main>
</body>
</html>
