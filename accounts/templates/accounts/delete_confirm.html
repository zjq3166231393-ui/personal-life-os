<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>删除账户</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:480px">
<section class="hero p-4 shadow-sm mb-4"><h1 class="h5 fw-bold">⚠ 删除账户</h1></section>
<section class="card shadow-sm p-4">
  <p>此操作将：</p><ul><li>停用账户（无法登录）</li><li>保留数据（可恢复）</li><li>记录审计日志</li></ul>
  <p class="text-danger fw-bold">此操作不可撤销。</p>
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label">输入 DELETE 确认</label><input type="text" name="confirm" class="form-control" required placeholder="DELETE"></div>
    <button type="submit" class="btn btn-danger w-100">确认删除</button>
    <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 mt-2">取消</a>
  </form>
</section></main></body></html>
