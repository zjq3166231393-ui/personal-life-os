{% extends "_base.html" %}
{% block title %}删除账户 · Personal Life OS{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:480px;padding-top:48px;">

  <section class="lf-hero lf-hero--danger lf-mb-6" style="padding:28px 24px;">
    <div class="lf-row" style="gap:10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <h1 style="font-size:20px;font-weight:700;color:#fff;margin:0;">删除账户</h1>
    </div>
  </section>

  <section class="lf-card lf-card--padded">
    <p class="lf-text-sm lf-mb-3">此操作将：</p>
    <ul class="lf-text-sm lf-text-muted" style="margin:0 0 16px;padding-left:18px;line-height:1.9;">
      <li>停用账户（无法登录）</li>
      <li>保留数据（可恢复）</li>
      <li>记录审计日志</li>
    </ul>
    <p class="lf-alert lf-alert--danger">此操作不可撤销。</p>
    <form method="post">{% csrf_token %}
      <div class="lf-field">
        <label class="lf-label">输入 DELETE 确认</label>
        <input type="text" name="confirm" class="lf-input" required placeholder="DELETE">
      </div>
      <button type="submit" class="lf-btn lf-btn--danger lf-btn--block">确认删除</button>
      <a href="{% url 'home' %}" class="lf-btn lf-btn--ghost lf-btn--block lf-mt-2">取消</a>
    </form>
  </section>

</main>
{% endblock %}
