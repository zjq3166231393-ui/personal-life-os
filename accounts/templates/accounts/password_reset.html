<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>重置密码</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4 py-md-5" style="max-width:480px">
<section class="hero p-4 shadow-sm mb-4 text-center"><h1 class="h4 fw-bold mb-1">重置密码</h1></section>
<section class="card shadow-sm p-4"><form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label">邮箱</label><input type="email" name="email" class="form-control" required></div>
<button type="submit" class="btn btn-dark w-100">发送重置链接</button></form>
<p class="text-center text-secondary mt-3 mb-0 small"><a href="{% url 'login' %}">返回登录</a></p></section>
</main></body></html>
