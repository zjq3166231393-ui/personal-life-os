{% extends "_base.html" %}
{% block title %}重置密码 · Personal Life OS{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:440px;padding-top:48px;">
  <section class="lf-hero lf-text-center lf-mb-6" style="padding:32px 24px;">
    <div style="width:56px;height:56px;margin:0 auto 16px;background:rgba(255,255,255,.16);border-radius:16px;display:flex;align-items:center;justify-content:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 style="font-size:22px;font-weight:700;color:#fff;margin:0;">重置密码</h1>
    <p style="margin:6px 0 0;color:rgba(255,255,255,.8);font-size:13px;">输入注册邮箱，我们将发送重置链接</p>
  </section>
  <section class="lf-card lf-card--padded">
    <form method="post">{% csrf_token %}
      <div class="lf-field">
        <label for="id_email" class="lf-label">邮箱</label>
        <input type="email" name="email" id="id_email" class="lf-input" required>
      </div>
      <button type="submit" class="lf-btn lf-btn--primary lf-btn--lg lf-btn--block">发送重置链接</button>
    </form>
    <p class="lf-text-sm lf-text-faint lf-text-center lf-mt-4 lf-mb-0"><a href="{% url 'login' %}">返回登录</a></p>
  </section>
</main>
{% endblock %}
