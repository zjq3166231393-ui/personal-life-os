{% extends "_base.html" %}
{% block title %}密码已重置 · Personal Life OS{% endblock %}
{% block body %}
<main class="lf-container" style="max-width:480px;padding-top:48px;">
  <section class="lf-card lf-card--padded lf-text-center">
    <div style="width:56px;height:56px;margin:0 auto 16px;background:var(--success-soft);border-radius:16px;display:flex;align-items:center;justify-content:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="lf-page-header__title lf-mb-2">密码已重置</h1>
    <p class="lf-text-sm lf-text-faint lf-mb-4">密码已成功修改，现在可以用新密码登录。</p>
    <a href="{% url 'login' %}" class="lf-btn lf-btn--primary lf-btn--block">去登录</a>
  </section>
</main>
{% endblock %}
