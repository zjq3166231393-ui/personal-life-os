<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} - Personal Life OS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{background:#f5f7fb;font-family:'Noto Sans SC',system-ui,sans-serif}.card{border:0;border-radius:18px}.hero{background:linear-gradient(135deg,#183b77,#2563eb);color:#fff;border-radius:22px}</style></head>
<body><main class="container py-4" style="max-width:800px">
<section class="hero p-4 shadow-sm mb-4 d-flex justify-content-between"><div><h1 class="h5 fw-bold mb-0">{{ title }}</h1></div><a href="{% url 'home' %}" class="text-white text-decoration-none small">← 首页</a></section>
<section class="card shadow-sm p-0"><table class="table table-borderless mb-0 small"><thead class="table-light"><tr><th class="ps-3">时间</th><th>操作</th><th>摘要</th></tr></thead><tbody>
{% for log in logs %}<tr><td class="ps-3 text-nowrap text-secondary">{{ log.created_at|date:'m-d H:i' }}</td><td class="text-nowrap"><span class="badge text-bg-light">{{ log.get_action_display }}</span></td><td>{{ log.summary }}</td></tr>
{% empty %}<tr><td colspan="3" class="ps-3 text-secondary py-3">暂无操作日志。</td></tr>{% endfor %}</tbody></table></section>
</main></body></html>
